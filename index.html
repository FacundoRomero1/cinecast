    <script>
      (function () {
        // Intercept and prevent uncaught TypeError when external/iframe scripts attempt to assign to read-only fetch
        window.addEventListener('error', function (event) {
          if (
            event.message &&
            event.message.indexOf('fetch') !== -1 &&
            (event.message.indexOf('getter') !== -1 || event.message.indexOf('read only') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Ensure window.fetch has both a getter and a setter so assignments don't fail
        try {
          var origFetch = window.fetch;
          var curFetch = origFetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
            (window.Window && Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch'));

          if (!desc || desc.configurable !== false) {
            Object.defineProperty(window, 'fetch', {
              get: function () {
                return curFetch;
              },
              set: function (fn) {
                curFetch = fn;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (_) {}
      })();
    </script>
